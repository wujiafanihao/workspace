redis:
  addr_env: REDIS_ADDR
  queue_key: "trace:persist"
  queue_type: "stream"
  group: "trace-persist-workers"
  consumer: "go-worker-1"
sqlite:
  path: "../backend/data/logs.db"
  busy_timeout_ms: 5000
  batch_size: 100
  flush_interval_ms: 100
cache:
  prefix: "trace:"
  invalidate_mode: "delete"
